name: Build Release

on:
  push:
    tags:
      - "vault-v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      # Fails the release before any builds run if the bundled DNA hApp files
      # are out of sync between tauri.conf.json, dna.rs constants, and the
      # actual files in src-tauri/resources/.
      - name: Check DNA bundle sync
        run: ./scripts/check-bundle-sync.sh

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#vault-v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the block between "## [<version>]" and the next "## [" heading.
          # Fall back to an empty string if no matching entry exists.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-body.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = "${{ steps.version.outputs.version }}";
            // Tags like v0.5.2 are stable; v0.5.2-beta1 / v0.5.2-rc1 are
            // pre-releases. Marking pre-releases correctly keeps them out
            // of GitHub's "Latest" slot when they're published.
            const isPrerelease = version.includes('-');
            const tagline = "Zero-knowledge desktop companion for Flowsta — holds your keys, your data, signs your files, never leaves your machine.";
            const changelog = fs.readFileSync('/tmp/release-body.md', 'utf8').trim();
            const body = [
              `## Flowsta Vault v${version}`,
              '',
              tagline,
              '',
              changelog || '',
              '### Downloads',
              'See assets below for platform-specific installers.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Flowsta Vault v${version}`,
              body,
              draft: true,
              prerelease: isPrerelease,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned to windows-2022 (VS 2022) — `windows-latest` rolled to a
          # VS 2026 image whose newer MSVC headers fail to compile
          # aws-lc-sys 0.33.0's c11 test (C1189: "C atomics require C11 or
          # later"). Revisit once aws-lc-sys upstream catches up.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Bundled conductor + keystore: download the official Holochain 0.6.1
      # release binaries instead of `cargo install` from source. These are the
      # exact artifacts the production conductors run, and skipping the
      # from-source compile cuts the build by roughly an hour. Holochain
      # publishes binaries for all four of Vault's target triples; lair-keystore
      # ships in the same release (it is the 0.6.3 lair Holochain 0.6.1 pins).
      #
      # We rename the binaries to a `vault-` prefix on download so the
      # resulting .deb / .msi ship them as /usr/bin/vault-{holochain,
      # lair-keystore} — avoiding the collision with other Tauri/Holochain
      # apps (e.g. ProofPoll) that also ship binaries with the bare names.
      - name: Fetch Holochain 0.6.1 binaries (Unix)
        if: runner.os != 'Windows'
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          mkdir -p src-tauri/binaries
          base="https://github.com/holochain/holochain/releases/download/${HC_RELEASE}"
          for bin in holochain lair-keystore; do
            dest="src-tauri/binaries/vault-${bin}-${{ matrix.target }}"
            curl -fsSL "${base}/${bin}-${{ matrix.target }}" -o "$dest"
            chmod +x "$dest"
            test "$(wc -c < "$dest")" -gt 1000000 || { echo "$bin download too small"; exit 1; }
          done

      - name: Fetch Holochain 0.6.1 binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $base = "https://github.com/holochain/holochain/releases/download/$env:HC_RELEASE"
          $t = "${{ matrix.target }}"
          foreach ($bin in "holochain","lair-keystore") {
            $dest = "src-tauri/binaries/vault-$bin-$t.exe"
            Invoke-WebRequest "$base/$bin-$t.exe" -OutFile $dest
            if ((Get-Item $dest).Length -lt 1000000) { throw "$bin download too small" }
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download CodeSignTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "CODE_SIGN_TOOL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Pre-release tags (e.g. vault-v0.5.2-beta1) need to skip the MSI
      # bundle on Windows: the MSI bundler requires numeric-only pre-release
      # identifiers and rejects "beta1". NSIS has no such restriction and
      # is what end users install anyway. Stable tags (vault-v0.5.2) get
      # the full bundle list from tauri.conf.json.
      - name: Compute Tauri bundle args
        id: tauri_args
        shell: bash
        run: |
          EXTRA=""
          VERSION="${GITHUB_REF_NAME#vault-v}"
          if [[ "$RUNNER_OS" == "Windows" ]] && [[ "$VERSION" == *-* ]]; then
            EXTRA=" --bundles nsis"
            echo "Pre-release detected ($VERSION) — skipping MSI bundle on Windows"
          fi
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # base64(STANDARD) of {"client_id":"<vault-prod-app>"} — written
          # into base64_auth_material_bootstrap AND _relay by conductor.rs.
          # Safe to ship before bootstrap.flowsta.com is flipped to
          # required-auth: an auth-material set against an open bootstrap
          # is a no-op. client_id is a public identifier; the secret just
          # keeps it out of the workflow file.
          FLOWSTA_AUTH_MATERIAL: ${{ secrets.FLOWSTA_AUTH_MATERIAL_PRODUCTION }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}${{ steps.tauri_args.outputs.extra }}

      - name: Dump Windows signing transcript on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path $log) {
            Write-Host "===== sign-windows.log ====="
            Get-Content $log
            Write-Host "===== end log ====="
          } else {
            Write-Host "No sign-windows.log at $log"
          }

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = process.env.release_id;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            // Tauri's auto-update tarballs ship without the version in their
            // filename ("Flowsta Vault_aarch64.app.tar.gz"); inject it in the
            // rename so they end up consistent with the .dmg naming.
            const version = context.ref.replace('refs/tags/vault-v', '');

            const renames = {
              '_aarch64.dmg': '-macOS-Apple-Silicon.dmg',
              '_x64.dmg': '-macOS-Intel.dmg',
              '_amd64.deb': '-Linux.deb',
              '-1.x86_64.rpm': '-Linux.rpm',
              '_x64-setup.exe': '-Windows-Setup.exe',
              '_x64_en-US.msi': '-Windows.msi',
              '_aarch64.app.tar.gz': `_${version}-macOS-Apple-Silicon.app.tar.gz`,
              '_x64.app.tar.gz': `_${version}-macOS-Intel.app.tar.gz`,
              '_aarch64.app.tar.gz.sig': `_${version}-macOS-Apple-Silicon.app.tar.gz.sig`,
              '_x64.app.tar.gz.sig': `_${version}-macOS-Intel.app.tar.gz.sig`,
            };

            for (const asset of assets) {
              for (const [oldSuffix, newSuffix] of Object.entries(renames)) {
                if (asset.name.endsWith(oldSuffix)) {
                  const newName = asset.name.replace(oldSuffix, newSuffix);
                  console.log(`Renaming: ${asset.name} → ${newName}`);
                  await github.rest.repos.updateReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    name: newName,
                  });
                  break;
                }
              }
            }

      # Hash every published asset (after the renames above, so the names in
      # SHA256SUMS.txt match the final download filenames) and attach the
      # checksums file to the release. Lets users verify a downloaded binary
      # with `sha256sum -c SHA256SUMS.txt`.
      - name: Generate SHA256 checksums
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const crypto = require('crypto');
            const releaseId = Number(process.env.release_id);
            const { owner, repo } = context.repo;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: releaseId, per_page: 100,
            });

            // Drop a stale checksums file from a previous run so the re-upload
            // below doesn't collide on the asset name.
            for (const a of assets) {
              if (a.name === 'SHA256SUMS.txt') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

            const lines = [];
            for (const a of assets) {
              if (a.name === 'SHA256SUMS.txt') continue;
              const res = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } }
              );
              const hash = crypto.createHash('sha256').update(Buffer.from(res.data)).digest('hex');
              lines.push(`${hash}  ${a.name}`);
              console.log(`${hash}  ${a.name}`);
            }
            lines.sort();

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: releaseId,
              name: 'SHA256SUMS.txt',
              data: lines.join('\n') + '\n',
            });

      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            });
