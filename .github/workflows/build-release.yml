name: Build Release

on:
  push:
    tags:
      - "vault-v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#vault-v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the block between "## [<version>]" and the next "## [" heading.
          # Fall back to an empty string if no matching entry exists.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-body.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = "${{ steps.version.outputs.version }}";
            const tagline = "Zero-knowledge desktop companion for Flowsta — holds your keys, your data, signs your files, never leaves your machine.";
            const changelog = fs.readFileSync('/tmp/release-body.md', 'utf8').trim();
            const body = [
              `## Flowsta Vault v${version}`,
              '',
              tagline,
              '',
              changelog || '',
              '### Downloads',
              'See assets below for platform-specific installers.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Flowsta Vault v${version}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Build Holochain binaries
        run: |
          cargo install holochain --version 0.6.0 --locked
          cargo install lair_keystore --version 0.6.3 --locked

      - name: Place Holochain binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          cp "$(which holochain)" "src-tauri/binaries/holochain-${{ matrix.target }}"
          cp "$(which lair-keystore)" "src-tauri/binaries/lair-keystore-${{ matrix.target }}"

      - name: Place Holochain binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $hc = (Get-Command holochain).Source
          $lair = (Get-Command lair-keystore).Source
          Copy-Item $hc "src-tauri/binaries/holochain-${{ matrix.target }}.exe"
          Copy-Item $lair "src-tauri/binaries/lair-keystore-${{ matrix.target }}.exe"

      - name: Install frontend dependencies
        run: npm install

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download CodeSignTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "CODE_SIGN_TOOL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = process.env.release_id;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const renames = {
              '_aarch64.dmg': '-macOS-Apple-Silicon.dmg',
              '_x64.dmg': '-macOS-Intel.dmg',
              '_amd64.AppImage': '-Linux.AppImage',
              '_amd64.deb': '-Linux.deb',
              '-1.x86_64.rpm': '-Linux.rpm',
              '_x64-setup.exe': '-Windows-Setup.exe',
              '_x64_en-US.msi': '-Windows.msi',
              '_aarch64.app.tar.gz': '-macOS-Apple-Silicon.app.tar.gz',
              '_x64.app.tar.gz': '-macOS-Intel.app.tar.gz',
              '_aarch64.app.tar.gz.sig': '-macOS-Apple-Silicon.app.tar.gz.sig',
              '_x64.app.tar.gz.sig': '-macOS-Intel.app.tar.gz.sig',
            };

            for (const asset of assets) {
              for (const [oldSuffix, newSuffix] of Object.entries(renames)) {
                if (asset.name.endsWith(oldSuffix)) {
                  const newName = asset.name.replace(oldSuffix, newSuffix);
                  console.log(`Renaming: ${asset.name} → ${newName}`);
                  await github.rest.repos.updateReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    name: newName,
                  });
                  break;
                }
              }
            }

      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            });
