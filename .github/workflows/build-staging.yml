name: Build Staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          # Pinned to windows-2022 (VS 2022) — `windows-latest` rolled to a
          # VS 2026 image whose newer MSVC headers fail to compile
          # aws-lc-sys 0.33.0's c11 test (C1189: "C atomics require C11 or
          # later"). Revisit once aws-lc-sys upstream catches up.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the compiler; rustup installs that toolchain
      # with the host target only, so the matrix target is added to it here
      # (the Intel macOS build of 1.7.0-beta2 failed without this).
      - name: Add the build target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Bundled conductor + keystore: download the official Holochain 0.6.1
      # release binaries instead of `cargo install` from source. These are the
      # exact artifacts the production conductors run, and skipping the
      # from-source compile cuts the build by roughly an hour. Holochain
      # publishes binaries for all four of Vault's target triples; lair-keystore
      # ships in the same release (it is the 0.6.3 lair Holochain 0.6.1 pins).
      #
      # Renamed to `vault-` prefix on download — see release workflow for why.
      - name: Fetch Holochain 0.6.1 binaries (Unix)
        if: runner.os != 'Windows'
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          mkdir -p src-tauri/binaries
          pinned() { awk -v k="$1" '$1 !~ /^#/ && $2 == k { print $1 }' .github/holochain-sidecars.sha256; }
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          check() { # file, release/asset
            w=$(pinned "$2"); g=$(sha "$1")
            [ -n "$w" ] && [ "$g" = "$w" ] || { echo "$2: SHA-256 $g does not match the pinned ${w:-(none)}"; exit 1; }
          }
          base="https://github.com/holochain/holochain/releases/download/${HC_RELEASE}"
          for bin in holochain lair-keystore; do
            dest="src-tauri/binaries/vault-${bin}-${{ matrix.target }}"
            curl -fsSL "${base}/${bin}-${{ matrix.target }}" -o "$dest"
            chmod +x "$dest"
            check "$dest" "${HC_RELEASE}/${bin}-${{ matrix.target }}"
          done

      # The Holochain 0.7.1 line beside 0.6.1 (the 1.7.0 transition: a 0.7
      # conductor and its own lair per identity; ProofPoll 0.5.0 ships the
      # same four-sidecar shape).
      - name: Fetch Holochain 0.7.1 binaries (Unix)
        if: runner.os != 'Windows'
        env:
          HC_RELEASE_07: holochain-0.7.1
        run: |
          pinned() { awk -v k="$1" '$1 !~ /^#/ && $2 == k { print $1 }' .github/holochain-sidecars.sha256; }
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          check() { # file, release/asset
            w=$(pinned "$2"); g=$(sha "$1")
            [ -n "$w" ] && [ "$g" = "$w" ] || { echo "$2: SHA-256 $g does not match the pinned ${w:-(none)}"; exit 1; }
          }
          base="https://github.com/holochain/holochain/releases/download/${HC_RELEASE_07}"
          for bin in holochain lair-keystore; do
            dest="src-tauri/binaries/vault-${bin}-07-${{ matrix.target }}"
            curl -fsSL "${base}/${bin}-${{ matrix.target }}" -o "$dest"
            chmod +x "$dest"
            check "$dest" "${HC_RELEASE_07}/${bin}-${{ matrix.target }}"
          done

      - name: Fetch Holochain 0.6.1 binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          function Assert-Pinned($file, $key) {
            $want = Get-Content .github/holochain-sidecars.sha256 | Where-Object { $_ -notmatch '^\s*#' } |
              ForEach-Object { $p = $_ -split '\s+'; if ($p[1] -eq $key) { $p[0] } } | Select-Object -First 1
            $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if (-not $want -or $got -ne $want) { throw "${key}: SHA-256 $got does not match the pinned $want" }
          }
          $base = "https://github.com/holochain/holochain/releases/download/$env:HC_RELEASE"
          $t = "${{ matrix.target }}"
          foreach ($bin in "holochain","lair-keystore") {
            $dest = "src-tauri/binaries/vault-$bin-$t.exe"
            Invoke-WebRequest "$base/$bin-$t.exe" -OutFile $dest
            Assert-Pinned $dest "$env:HC_RELEASE/$bin-$t.exe"
          }

      - name: Fetch Holochain 0.7.1 binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HC_RELEASE_07: holochain-0.7.1
        run: |
          function Assert-Pinned($file, $key) {
            $want = Get-Content .github/holochain-sidecars.sha256 | Where-Object { $_ -notmatch '^\s*#' } |
              ForEach-Object { $p = $_ -split '\s+'; if ($p[1] -eq $key) { $p[0] } } | Select-Object -First 1
            $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if (-not $want -or $got -ne $want) { throw "${key}: SHA-256 $got does not match the pinned $want" }
          }
          $base = "https://github.com/holochain/holochain/releases/download/$env:HC_RELEASE_07"
          $t = "${{ matrix.target }}"
          foreach ($bin in "holochain","lair-keystore") {
            $dest = "src-tauri/binaries/vault-$bin-07-$t.exe"
            Invoke-WebRequest "$base/$bin-$t.exe" -OutFile $dest
            Assert-Pinned $dest "$env:HC_RELEASE_07/$bin-$t.exe"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOWSTA_API_URL: ${{ vars.STAGING_API_URL }}
          FLOWSTA_BOOTSTRAP_URL: ${{ vars.STAGING_BOOTSTRAP_URL }}
          # No community fallback here: node1 serves the production network,
          # and a staging build falling back to it would join the wrong
          # network and see an empty DHT with no error. Staging builds
          # should fail loudly (offline log) when the staging bootstrap is
          # unreachable. Release builds keep the fallback list.
          FLOWSTA_SIGNAL_URL: ${{ vars.STAGING_SIGNAL_URL }}
          # The 0.7 line's bootstrap (kitsune2 0.5.x) on the staging bootstrap VM.
          FLOWSTA_BOOTSTRAP_URL_07: https://bootstrap-staging-7.flowsta.com
          # base64(STANDARD) of {"client_id":"<vault-staging-app>"} — same value
          # goes into both base64_auth_material_bootstrap and _relay in the
          # conductor config. Vault Staging registered as a Holochain app in
          # dev-staging.flowsta.com. client_id is a public identifier; the
          # secret just keeps the value out of the workflow file for cleanliness.
          FLOWSTA_AUTH_MATERIAL: ${{ secrets.FLOWSTA_AUTH_MATERIAL_STAGING }}
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
          VITE_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          # Staging builds never sign Windows binaries (eSigner bills per
          # signing; sign-windows.ps1 no-ops when this is 1).
          VAULT_SKIP_WINDOWS_SIGNING: 1
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          args: --target ${{ matrix.target }} --config '{"identifier":"com.flowsta.vault.staging","productName":"Flowsta Vault (Staging)"}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Flowsta-Vault-Staging-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: ignore
          retention-days: 7
