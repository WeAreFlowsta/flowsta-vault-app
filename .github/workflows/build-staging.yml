name: Build Staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          # Pinned to windows-2022 (VS 2022) — `windows-latest` rolled to a
          # VS 2026 image whose newer MSVC headers fail to compile
          # aws-lc-sys 0.33.0's c11 test (C1189: "C atomics require C11 or
          # later"). Revisit once aws-lc-sys upstream catches up.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Bundled conductor + keystore: download the official Holochain 0.6.1
      # release binaries instead of `cargo install` from source. These are the
      # exact artifacts the production conductors run, and skipping the
      # from-source compile cuts the build by roughly an hour. Holochain
      # publishes binaries for all four of Vault's target triples; lair-keystore
      # ships in the same release (it is the 0.6.3 lair Holochain 0.6.1 pins).
      #
      # Renamed to `vault-` prefix on download — see release workflow for why.
      - name: Fetch Holochain 0.6.1 binaries (Unix)
        if: runner.os != 'Windows'
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          mkdir -p src-tauri/binaries
          base="https://github.com/holochain/holochain/releases/download/${HC_RELEASE}"
          for bin in holochain lair-keystore; do
            dest="src-tauri/binaries/vault-${bin}-${{ matrix.target }}"
            curl -fsSL "${base}/${bin}-${{ matrix.target }}" -o "$dest"
            chmod +x "$dest"
            test "$(wc -c < "$dest")" -gt 1000000 || { echo "$bin download too small"; exit 1; }
          done

      - name: Fetch Holochain 0.6.1 binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $base = "https://github.com/holochain/holochain/releases/download/$env:HC_RELEASE"
          $t = "${{ matrix.target }}"
          foreach ($bin in "holochain","lair-keystore") {
            $dest = "src-tauri/binaries/vault-$bin-$t.exe"
            Invoke-WebRequest "$base/$bin-$t.exe" -OutFile $dest
            if ((Get-Item $dest).Length -lt 1000000) { throw "$bin download too small" }
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOWSTA_API_URL: ${{ vars.STAGING_API_URL }}
          FLOWSTA_BOOTSTRAP_URL: ${{ vars.STAGING_BOOTSTRAP_URL }}
          FLOWSTA_SIGNAL_URL: ${{ vars.STAGING_SIGNAL_URL }}
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
          VITE_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          args: --target ${{ matrix.target }} --config '{"identifier":"com.flowsta.vault.staging","productName":"Flowsta Vault (Staging)"}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Flowsta-Vault-Staging-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: ignore
          retention-days: 7
