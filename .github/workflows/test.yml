name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri build script refuses to compile unless the sidecar binaries
      # (externalBin) and the front-end dist exist. Unit tests never spawn the
      # sidecars and never load the front end, so placeholders are enough
      # here; the release workflow fetches the real Holochain binaries. This
      # workflow had been red since August for exactly this reason.
      - name: Placeholder sidecars and front-end dist for the build script
        run: |
          mkdir -p src-tauri/binaries dist
          for b in vault-holochain vault-lair-keystore; do
            f="src-tauri/binaries/$b-x86_64-unknown-linux-gnu"
            [ -f "$f" ] || { printf '#!/bin/sh\nexit 0\n' > "$f"; chmod +x "$f"; }
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # Debug builds skip every #[cfg(not(debug_assertions))] arm; code used
      # only there rots invisibly and once failed all four release builds at
      # the tag. Compile those arms on every push instead.
      - name: Release-profile check
        working-directory: src-tauri
        run: cargo check --release
