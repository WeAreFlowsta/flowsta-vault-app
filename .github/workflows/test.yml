name: Tests

on:
  push:
    branches: [main, hc-lines]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"

jobs:
  rust-tests:
    # The same tests on each platform the Vault ships for: paths, sidecar
    # names and process handling differ between them.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri build script refuses to compile unless the sidecar binaries
      # (externalBin) and the front-end dist exist. Unit tests never spawn the
      # sidecars and never load the front end, so placeholders are enough
      # here; the release workflow fetches the real Holochain binaries. This
      # workflow had been red since August for exactly this reason.
      # bash on Windows too, for this step only: Git Bash's perl cannot
      # configure the vendored OpenSSL, so cargo runs in the default shell.
      - name: Placeholder sidecars and front-end dist for the build script
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist
          triple=$(cd src-tauri && rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          for b in vault-holochain vault-lair-keystore vault-holochain-07 vault-lair-keystore-07; do
            f="src-tauri/binaries/$b-$triple$ext"
            [ -f "$f" ] || { printf '#!/bin/sh\nexit 0\n' > "$f"; chmod +x "$f"; }
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # Debug builds skip every #[cfg(not(debug_assertions))] arm; code used
      # only there rots invisibly and once failed all four release builds at
      # the tag. Compile those arms on every push instead.
      - name: Release-profile check
        working-directory: src-tauri
        run: cargo check --release
