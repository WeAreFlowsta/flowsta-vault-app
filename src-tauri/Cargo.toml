[package]
name = "flowsta-vault"
version = "1.6.0"
description = "Flowsta Vault - The home of your Flowsta identity, powered by Holochain"
authors = ["Flowsta"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Key derivation (port of api/src/services/recoveryPhrase.js)
bip39 = { version = "2", features = ["default"] }
hmac = "0.12"
# Adding a device with a code: both devices agree a key from the typed code.
spake2 = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Master password vault encryption
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"

# Password-derived key for decrypting exported account fields during
# account migration (matches api/src/services/encryption.js: scrypt
# N=16384, r=8, p=1 → AES-256-GCM)
scrypt = { version = "0.11", default-features = false }

# Encoding
hex = "0.4"
flate2 = "1"
base64 = "0.22"
bs58 = "0.5"
percent-encoding = "2"

# DHT location computation (matches Holochain's holo_hash crate)
blake2 = "0.10"

# MessagePack serialization (matches Holochain's verify_signature encoding)
rmp-serde = "1.3"
serde_bytes = "0.11"

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# IPC server (localhost:27777 for SDK bridge)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Lair keystore client API (seed import + signing via lair).
# Holochain 0.6.1 pins lair_keystore_api to exactly 0.6.3 — match it so the
# bundled lair-keystore binary (0.6.3) and this client can never drift.
lair_keystore_api = "=0.6.3"

# Holochain conductor client (AdminWebsocket for DNA install + AppWebsocket for zome calls).
# Conductor 0.6.1 → Rust client 0.8.1 (released 2026-05-12 for Holochain 0.6.1).
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"
# Building CoordinatorBundle for UpdateCoordinators hot-swaps (same version
# holochain_types 0.6.1 uses).
mr_bundle = "=0.6.1"

# Save dialog
tauri-plugin-dialog = "2"
# A system notification when a device is added to the identity.
tauri-plugin-notification = "2"

# Image analysis (Sign It file integrity checks — LSB steganography detection)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }

# Audio decoding for perceptual hashing (Sign It)
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "aac", "isomp4", "mkv"] }
rusty-chromaprint = "0.3"

# Error handling
thiserror = "1.0"

# Process table: the startup sweep of orphaned sidecars (instance_guard.rs)
sysinfo = "0.33"

# RFC 7231 Date header parsing for the clock-skew message (device_identity.rs)
httpdate = "1"

# UI test harness only (e2e/README.md): an embedded WebDriver server inside
# the app. Behind the `e2e` feature, which no release build carries -
# scripts/check-no-e2e-feature.mjs proves it.
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[features]
# Test builds only: `npm run e2e:build` builds with `--features e2e`.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# oneshot() for the IPC guard tests (already in the tree via axum).
tower = { version = "0.5", features = ["util"] }
# TOTP computation in the staging migration tests (otplib-compatible
# HMAC-SHA1 codes for the two-factor account variant)
sha1 = "0.10"
tempfile = "3"

# Linux + macOS: PR_SET_PDEATHSIG (Linux) so child processes (lair-keystore,
# holochain conductor) get SIGTERM if the parent vault process dies, and
# getuid (both) for peer_owner.rs. (TOML section headers capture all keys
# until the next header, so anything placed after this becomes unix-only
# too - see also the Windows block below.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: the sidecars (lair-keystore.exe / holochain.exe) are spawned
# through CreateProcessW with their console window created hidden, tied to a
# kill-on-close Job Object, with a post-spawn EnumWindows + ShowWindow(SW_HIDE)
# sweep as the second line - see process_ext.rs.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # ToolHelp32 for parent-PID lookup - hide thread uses it to find
    # conhost.exe children of our spawned binaries on Windows.
    "Win32_System_Diagnostics_ToolHelp",
    # Kill-on-close Job Object so sidecars die with the app (see process_ext.rs).
    # CreateJobObjectW needs Win32_Security (SECURITY_ATTRIBUTES), and
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds Threading::IO_COUNTERS.
    "Win32_System_JobObjects",
    "Win32_Security",
    # CreateProcessW + STARTUPINFOW (hidden console) and the stdin pipe.
    "Win32_System_Threading",
    "Win32_System_Pipes",
    # peer_owner.rs: which process (and Windows session) owns a loopback
    # connection to the Vault.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_RemoteDesktop",
] }

# core2 (transitive dep via libflate → libsodium-sys-stable → sodoken → lair)
# was yanked from crates.io on 2026-04-14 when the maintainer archived it.
# The upstream GitHub repo no longer contains the source, so we vendor the
# 0.4.0 crate locally in vendor/core2 to keep fresh cargo resolves succeeding.
[patch.crates-io]
core2 = { path = "vendor/core2" }
