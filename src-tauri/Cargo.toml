[package]
name = "flowsta-vault"
version = "0.5.2-rc1"
description = "Flowsta Vault - Desktop identity manager powered by Holochain"
authors = ["Flowsta"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Key derivation (port of api/src/services/recoveryPhrase.js)
bip39 = { version = "2", features = ["default"] }
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Master password vault encryption
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"

# Encoding
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
percent-encoding = "2"

# DHT location computation (matches Holochain's holo_hash crate)
blake2 = "0.10"

# MessagePack serialization (matches Holochain's verify_signature encoding)
rmp-serde = "1.3"

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json"] }

# IPC server (localhost:27777 for SDK bridge)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Lair keystore client API (seed import + signing via lair)
lair_keystore_api = "0.6"

# Holochain conductor client (AdminWebsocket for DNA install + AppWebsocket for zome calls)
# Conductor 0.6.x → Rust client 0.8.x (matches holochain_conductor_api 0.6.0)
holochain_client = { version = "0.8.0", default-features = false }
holochain_types = "0.6"

# Save dialog
tauri-plugin-dialog = "2"

# Image analysis (Sign It file integrity checks — LSB steganography detection)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }

# Audio decoding for perceptual hashing (Sign It)
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "aac", "isomp4", "mkv"] }
rusty-chromaprint = "0.3"

# Error handling
thiserror = "1.0"

# Linux-only: PR_SET_PDEATHSIG so child processes (lair-keystore, holochain
# conductor) get SIGTERM if the parent vault process dies for any reason.
# (TOML section headers capture all keys until the next header, so anything
# placed after this becomes Linux-only too — see also the Windows block
# below.)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows-only: EnumWindows + ShowWindow(SW_HIDE) so the spawned
# lair-keystore.exe / holochain.exe console windows are hidden post-spawn
# without using CREATE_NO_WINDOW (which crashed holochain in v0.5.0 by
# preventing console-handle allocation — see process_ext.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # ToolHelp32 for parent-PID lookup — hide thread uses it to find
    # conhost.exe children of our spawned binaries on Windows.
    "Win32_System_Diagnostics_ToolHelp",
] }

# core2 (transitive dep via libflate → libsodium-sys-stable → sodoken → lair)
# was yanked from crates.io on 2026-04-14 when the maintainer archived it.
# The upstream GitHub repo no longer contains the source, so we vendor the
# 0.4.0 crate locally in vendor/core2 to keep fresh cargo resolves succeeding.
[patch.crates-io]
core2 = { path = "vendor/core2" }
